---
- name: Install Apache
  ansible.builtin.dnf:
    name: "{{ web_package }}"
    state: present

- name: Add landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart Apache

- name: Start Apache
  ansible.builtin.systemd_service:
    name: "{{ web_service }}"
    state: started
    enabled: true
