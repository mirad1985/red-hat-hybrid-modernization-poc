---
- name: Install Apache web server
  ansible.builtin.dnf:
    name: "{{ web_package }}"
    state: present

- name: Deploy Unreal Logistics landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart web server

- name: Ensure Apache is running
  ansible.builtin.systemd_service:
    name: "{{ web_service }}"
    state: started
    enabled: true
    